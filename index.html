<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | Drill 2</title>

    <style>
        :root {
            --navy: #0a1f44;
            --navy-light: #1b3a73;
            --white: #ffffff;
        }

        body {
            background-color: var(--navy);
        }

        .form-card {
            background-color: var(--white);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .form-card h3 {
            color: var(--navy);
            font-weight: 700;
        }

        .form-control:focus {
            border-color: var(--navy-light);
            box-shadow: 0 0 0 0.25rem rgba(27, 58, 115, 0.25);
        }

        .btn-navy {
            background-color: var(--navy);
            color: var(--white);
            border: none;
            padding: 0.5rem 1.5rem;
        }

        .btn-navy:hover {
            background-color: var(--navy-light);
            color: var(--white);
        }

        #output {
            background-color: var(--white);
            color: var(--navy);
            border-left: 8px solid var(--navy-light);
            border-radius: 12px;
            font-size: 20px;
            min-height: 60px;
        }

        #output h4 {
            font-weight: 700;
            border-bottom: 2px solid var(--navy);
            padding-bottom: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 700px;">
        <div class="form-card mb-4">
            <h3 class="mb-4">Add new club member:</h3>
            <form>
                <div class="mb-3">
                    <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
                </div>
                <div class="mb-3">
                    <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
                </div>
                <input type="button" value="Submit" py-click="result_checker" class="btn btn-navy">
            </form>
        </div>

        <div id="output" class="p-4 shadow"></div>
    </div>

    <script type="py" src="main.py"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
